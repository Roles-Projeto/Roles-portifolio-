<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Rolês</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formulario.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">Rolês<span class="ponto">.</span></a>
    <nav id="menu" class="menu"></nav>
  </header>

  <main class="auth-pagina">
    <aside class="auth-painel">
      <a class="auth-logo" href="index.html">Rolês<span>.</span></a>

      <div class="auth-painel-texto">
        <p class="auth-destaque">O que fazer em Goiânia começa aqui.</p>
        <p class="auth-apoio">Entre para cadastrar seus eventos e lugares e acompanhar tudo em um só lugar.</p>
      </div>

      <div class="auth-card" aria-hidden="true">
        <div class="auth-card-capa">
          <span class="auth-card-data"><strong>20</strong><small>DEZ</small></span>
        </div>
        <div class="auth-card-corpo">
          <span class="auth-card-tag">Shows</span>
          <span class="auth-card-nome">Show de Teste</span>
          <span class="auth-card-local">Casa de Shows · Goiânia</span>
        </div>
      </div>
    </aside>

    <section class="auth-area">
      <div class="auth-bloco">
        <div class="auth-cab">
          <h1>Entrar</h1>
          <p>Use seu e-mail e sua senha para acessar o Rolês.</p>
        </div>

        <button id="botao-google" class="auth-google" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continuar com o Google
        </button>

        <div class="auth-divisor">ou use seu e-mail</div>

        <form id="form-login" class="auth-form" novalidate>
          <div class="auth-campos">
            <div class="auth-campo">
              <label for="email">E-mail</label>
              <input id="email" type="email" name="email" required autocomplete="email" placeholder="voce@email.com" autofocus>
            </div>

            <div class="auth-campo">
              <label for="senha">Senha</label>
              <div class="auth-senha">
                <input id="senha" type="password" name="senha" required autocomplete="current-password">
                <button id="mostrar-senha" class="auth-mostrar" type="button" aria-label="Mostrar senha">Mostrar</button>
              </div>
            </div>
          </div>

          <div id="erros" class="erros" role="alert" hidden></div>

          <button id="botao-entrar" class="botao botao-auth" type="submit">Entrar</button>
        </form>

        <p class="auth-troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
