<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Rolês</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">Rolês<span class="ponto">.</span></a>
    <nav id="menu" class="menu"></nav>
  </header>

  <main class="conteudo estreito">
    <h1 class="titulo">Criar conta</h1>

    <form id="form-cadastro" class="form-auth" novalidate>
      <label class="campo-form">
        <span>Nome</span>
        <input type="text" name="nome" required minlength="2" maxlength="100" autocomplete="name">
      </label>

      <label class="campo-form">
        <span>E-mail</span>
        <input type="email" name="email" required maxlength="200" autocomplete="email">
      </label>

      <label class="campo-form">
        <span>Senha (mínimo de 8 caracteres)</span>
        <input type="password" name="senha" required minlength="8" maxlength="72" autocomplete="new-password">
      </label>

      <label class="campo-form">
        <span>Confirmar senha</span>
        <input type="password" name="confirmar" required minlength="8" maxlength="72" autocomplete="new-password">
      </label>

      <div id="erros" class="erros" role="alert" hidden></div>

      <button id="botao-cadastrar" class="botao" type="submit">Criar conta</button>

      <p class="alternativa">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
